<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>ILDC session poster</title>
<style>
  /* ---------- Fonts (bundled locally, no internet needed) ---------- */
  @font-face { font-family: Lato; font-weight: 400; src: url(/node_modules/@fontsource/lato/files/lato-latin-400-normal.woff2) format('woff2'); }
  @font-face { font-family: Lato; font-weight: 700; src: url(/node_modules/@fontsource/lato/files/lato-latin-700-normal.woff2) format('woff2'); }
  @font-face { font-family: Lato; font-weight: 900; src: url(/node_modules/@fontsource/lato/files/lato-latin-900-normal.woff2) format('woff2'); }
  @font-face { font-family: Title; font-weight: 800; src: url(/node_modules/@fontsource/barlow/files/barlow-latin-800-normal.woff2) format('woff2'); }

  /* ---------- One colour set per day (measured from the Canva design) ---------- */
  :root { --ink: #2e2d58; --pill: #f5d5cb; --cal: #f17c9b; --pin: #909dda; }
  body[data-colourway="purple"]  { --bg: #47438f; --fg: #ffffff; --title: #fff4e0; --conf: #ffffff; --circle: #e6d7ec; }
  body[data-colourway="mustard"] { --bg: #b8aa48; --fg: #000000; --title: #000000; --conf: #ffffff; --circle: #ffde59; }
  body[data-colourway="green"]   { --bg: #86bfa7; --fg: #000000; --title: #000000; --conf: #000000; --circle: #4e7376; }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; }
  body { font-family: Lato, sans-serif; color: var(--fg); background: var(--bg); position: relative; overflow: hidden; }
  .abs { position: absolute; }
  #art { left: 0; top: 0; width: 1080px; height: 1350px; }

  /* Header */
  #conf-logo { left: 67px; top: 67px; width: 120px; height: 120px; border-radius: 50%; background: #fff; display: grid; place-items: center; overflow: hidden; }
  #conf-logo img { width: 88%; height: 88%; object-fit: contain; }
  #conf-divider { left: 212px; top: 80px; width: 2px; height: 98px; background: var(--conf); opacity: .8; }
  #conf-name { left: 232px; top: 78px; font: 700 25.7px/1.2 Lato; letter-spacing: .13em; text-transform: uppercase; color: var(--conf); }

  .kicker { font-weight: 700; letter-spacing: .4em; text-transform: uppercase; }
  #session-no { left: 71px; top: 233px; font-size: 19.8px; }
  #title { left: 66px; top: 268px; width: 620px; height: 150px; display: flex; align-items: flex-start;
           font-family: Title; font-weight: 800; color: var(--title); line-height: .95; letter-spacing: -.01em; }

  /* Date / place */
  .meta { top: 430px; display: flex; align-items: center; gap: 10px; }
  .meta .ico { width: 94px; height: 94px; border-radius: 50%; display: grid; place-items: center; flex: none; }
  .meta .ico svg { width: 44px; height: 44px; }
  .meta b { display: block; font: 700 25.2px/1.25 Lato; }
  .meta span { font: 400 22px/1.25 Lato; }
  #when { left: 68px; } #when .ico { background: var(--cal); }
  #where-line { left: 444px; top: 430px; width: 2px; height: 91px; background: var(--fg); opacity: .55; }
  #where { left: 463px; } #where .ico { background: var(--pin); }

  /* Speakers */
  #speakers-label { left: 75px; top: 602px; font-size: 28.7px; }
  #speakers { left: 0; top: 679px; width: 1080px; display: flex; flex-direction: column; gap: 30px; }
  .row { display: flex; justify-content: center; gap: 0; }
  .sp { width: 196px; display: flex; flex-direction: column; align-items: center; }
  .sp .ph { width: 146px; height: 146px; border-radius: 50%; overflow: hidden; position: relative; background: var(--circle); }
  .sp .ph img { width: 100%; height: 100%; display: block; }
  .sp .ph .ini { position: absolute; inset: 0; display: grid; place-items: center; font: 800 52px Title; color: var(--ink); opacity: .55; }
  .sp .pill { margin-top: -10px; position: relative; width: 190px; min-height: 62px; background: var(--pill); color: var(--ink);
              border-radius: 31px; padding: 9px 12px; text-align: center; display: flex; flex-direction: column; justify-content: center; }
  /* Chair / moderator tag on top of the photo circle; nobody else gets a tag. */
  .sp .ph-wrap { position: relative; }
  .sp .tag { position: absolute; left: 50%; transform: translateX(-50%); z-index: 2; white-space: nowrap;
             font: 900 12.5px/1 Lato; letter-spacing: .14em; text-transform: uppercase; padding: 6px 12px 5px; border-radius: 12px;
             background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.18); }
  .sp .tag.moderator { background: #9a2d50; color: #fff; }
  body[data-tag="top"] .sp .tag { top: -11px; }
  body[data-tag="photo"] .sp .tag { bottom: 40px; }
  /* Group headings layout: one heading per role above its people, in place of "SPEAKERS". */
  body[data-tag="groups"] #speakers-label { display: none; }
  body[data-tag="groups"] #speakers { top: 600px; }
  body[data-tag="groups"] .row { gap: 0; align-items: flex-start; }
  .grp { display: flex; flex-direction: column; align-items: stretch; }
  .grp + .grp { border-left: 2px solid color-mix(in srgb, var(--fg) 35%, transparent); }
  .grp h3 { font: 700 20px/1 Lato; letter-spacing: .3em; text-transform: uppercase; text-align: center; color: var(--fg); margin: 0 0 24px; padding-top: 6px; }
  .grp .people { display: flex; }
  .sp .nm { font: 900 var(--nm, 18.7px) / 1.15 Lato; }
  .sp .ds { font: 400 calc(var(--nm, 18.7px) * .82) / 1.18 Lato; margin-top: 3px; }
  .sp .og { font: 700 calc(var(--nm, 18.7px) * .85) / 1.15 Lato; margin-top: 2px; }

  /* Footer */
  #footer { left: 0; top: 1243px; width: 1080px; height: 107px; background: #fff; display: flex; align-items: center; padding: 0 50px 0 56px; gap: 36px; }
  #footer .kicker { font-size: 19.1px; letter-spacing: .15em; color: var(--ink); white-space: nowrap; flex: none; }
  #logos { flex: 1; display: flex; align-items: center; justify-content: space-evenly; height: 100%; }
  #logos img { display: block; }
  #stamp { right: 10px; bottom: 4px; font: 400 8px Lato; color: #b9b6c9; }
</style>
</head>
<body>
<img id="art" class="abs" alt="">

<div id="conf-logo" class="abs"></div>
<div id="conf-divider" class="abs"></div>
<div id="conf-name" class="abs">India Land &amp; Development<br>Conference<br>2026</div>

<div id="session-no" class="abs kicker"></div>
<div id="title" class="abs"><span></span></div>

<div id="when" class="abs meta">
  <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="#1f1d3d" stroke-width="2.2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></div>
  <div style="margin-left:10px"><b id="date"></b><span id="time"></span></div>
</div>
<div id="where-line" class="abs"></div>
<div id="where" class="abs meta">
  <div class="ico"><svg viewBox="0 0 24 24" fill="#1f1d3d"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg></div>
  <div style="margin-left:10px"><b id="room"></b><span id="venue"></span></div>
</div>

<div id="speakers-label" class="abs kicker">Speakers</div>
<div id="speakers" class="abs"></div>

<div id="footer" class="abs"><div class="kicker">Session organised by</div><div id="logos"></div></div>
<div id="stamp" class="abs"></div>

<script>
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const initials = n => n.replace(/^(Dr|Prof) /, '').split(/\s+/).filter(w => /^[A-Z]/i.test(w)).slice(0, 2).map(w => w[0].toUpperCase()).join('');
const waitImages = () => Promise.all([...document.images].filter(i => i.src).map(i => i.complete ? 0 : new Promise(r => { i.onload = i.onerror = r; })));
function fit(el, box, max, min) {
  let s = max; el.style.fontSize = s + 'px';
  while ((box.scrollHeight > box.clientHeight + 1 || box.scrollWidth > box.clientWidth + 1) && s > min) { s -= 1; el.style.fontSize = s + 'px'; }
}

async function render(d) {
  document.body.dataset.colourway = d.colourway || 'purple';
  document.body.dataset.tag = d.tagPlace || 'top';
  if (d.art) document.getElementById('art').src = d.art;
  if (d.confLogo) document.getElementById('conf-logo').innerHTML = `<img src="${d.confLogo}">`;

  document.getElementById('session-no').textContent = `Session ${d.sessionNo}`;
  const t = document.querySelector('#title span'); t.textContent = d.title;
  document.getElementById('date').textContent = d.date;
  document.getElementById('time').textContent = d.time;
  document.getElementById('room').textContent = d.room;
  document.getElementById('venue').textContent = d.venue;

  // Speakers: up to 5 in a row; 6–10 in two rows of the same circles.
  const n = d.speakers.length, top = n > 5 ? Math.ceil(n / 2) : n;
  const rows = n > 5 ? [d.speakers.slice(0, top), d.speakers.slice(top)] : [d.speakers];
  const card = s => `
    <div class="sp"><div class="ph-wrap"><div class="ph">${s.photo ? `<img src="${s.photo}">` : `<div class="ini">${esc(initials(s.name))}</div>`}</div>
      ${s.role && document.body.dataset.tag !== 'groups' ? `<div class="tag${s.role === 'Moderator' ? ' moderator' : ''}">${esc(s.role)}</div>` : ''}</div>
      <div class="pill"><div class="nm">${esc(s.name)}</div>${s.designation ? `<div class="ds">${esc(s.designation)}</div>` : ''}<div class="og">${esc(s.organisation)}</div></div></div>`;
  if (document.body.dataset.tag === 'groups') {
    // Moderator / chair gets its own heading; everyone else sits under "Speakers". No per-person tags.
    const grpOf = s => s.role === 'Moderator' ? 'Moderator' : 'Speaker';
    const plural = { Moderator: 'Moderators', Speaker: 'Speakers' };
    const sorted = [...d.speakers].sort((a, b) => (grpOf(a) === 'Moderator' ? 0 : 1) - (grpOf(b) === 'Moderator' ? 0 : 1));
    const rowsG = n > 5 ? [sorted.slice(0, top), sorted.slice(top)] : [sorted];
    const count = g => sorted.filter(s => grpOf(s) === g).length;
    document.getElementById('speakers').innerHTML = rowsG.map((r, ri) => {
      const groups = []; r.forEach(s => { const g = groups[groups.length - 1]; if (g && g.role === grpOf(s)) g.list.push(s); else groups.push({ role: grpOf(s), list: [s] }); });
      return `<div class="row">${groups.map(g => `<div class="grp">${ri === 0 ? `<h3>${esc(count(g.role) > 1 ? plural[g.role] : g.role)}</h3>` : ''}<div class="people">${g.list.map(card).join('')}</div></div>`).join('')}</div>`;
    }).join('');
  } else
  document.getElementById('speakers').innerHTML = rows.map(r => `<div class="row">${r.map(s => `
    <div class="sp"><div class="ph-wrap"><div class="ph">${s.photo ? `<img src="${s.photo}">` : `<div class="ini">${esc(initials(s.name))}</div>`}</div>
      ${s.role === 'Moderator' || s.role === 'Chair' ? `<div class="tag moderator">${s.role}</div>` : ''}</div>
      <div class="pill"><div class="nm">${esc(s.name)}</div>${s.designation ? `<div class="ds">${esc(s.designation)}</div>` : ''}<div class="og">${esc(s.organisation)}</div></div></div>`).join('')}</div>`).join('');

  // Organiser logos: equal visual weight, capped size.
  const logos = document.getElementById('logos');
  const L = d.logos.length, avail = 1080 - 56 - 50 - 36 - 300, gap = 28, maxH = L <= 2 ? 70 : 60, maxW = L <= 2 ? 300 : 200;
  let area = maxH * maxH * 1.7;
  const dims = a => d.logos.map(l => { let h = Math.min(maxH, Math.sqrt(a / l.aspect)), w = h * l.aspect; if (w > maxW) { w = maxW; h = w / l.aspect; } return { w, h }; });
  let ds = dims(area);
  while (L && ds.reduce((s, x) => s + x.w, 0) + gap * (L - 1) > avail && area > 400) { area *= .92; ds = dims(area); }
  logos.innerHTML = d.logos.map((l, i) => `<img src="${l.src}" alt="${esc(l.name)}" style="width:${ds[i].w.toFixed(1)}px;height:${ds[i].h.toFixed(1)}px">`).join('');
  document.getElementById('stamp').textContent = d.stamp || '';

  await document.fonts.ready;
  await waitImages();
  fit(t, document.getElementById('title'), 65, 40);
  // Long names/organisations: shrink that pill's text so it stays a tidy pill.
  document.querySelectorAll('.sp .pill').forEach(p => {
    // Room under each circle: about 140 px of pill even with two rows of speakers.
    let s = 18.7;
    while (p.offsetHeight > 112 && s > 15.5) { s -= 0.5; p.style.setProperty('--nm', s + 'px'); }
    if (p.offsetHeight > 140) p.dataset.overflow = '1';
  });
  return checks(d);
}

function checks(d) {
  const w = [];
  const t = document.getElementById('title'); if (t.scrollHeight > t.clientHeight + 2) w.push('Title too long even at smallest size');
  document.querySelectorAll('.sp .pill[data-overflow]').forEach(p => w.push(`Text too long to fit: ${p.querySelector('.nm').textContent}`));
  return w;
}
</script>
</body>
</html>

// Programme agenda as a Word file: one table per day, the same columns as the ILDC 2025 agenda.
// Built from Airtable on every run; paper titles and unregistered (TBC) speakers are added by hand afterwards.
import fs from 'node:fs';
import { Document, Packer, Paragraph, TextRun, Table, TableRow, TableCell, WidthType, ShadingType, AlignmentType,
  BorderStyle, PageOrientation, VerticalAlign, HeadingLevel } from 'docx';

const FONT = 'Calibri';
const INK = '2E2D58';
// ILDC 2026 colours: each day's header in its poster colour, rows alternating a pale tint of it with the posters' cream.
const DAY_STYLE = {
  purple: { head: '47438F', text: 'FFFFFF', tint: 'E6D7EC' },
  mustard: { head: 'B8AA48', text: '000000', tint: 'F3EDC4' },
  green: { head: '86BFA7', text: '000000', tint: 'DCEEE6' },
};
const CREAM = 'FFF4E0';
// Column widths in twentieths of a point (A4 portrait, 1.5 cm margins → about 10 200 wide).
const COLS = [2500, 900, 1700, 2100, 3000];

const run = (text, o = {}) => new TextRun({ text, font: FONT, size: o.size || 18, bold: o.bold, italics: o.italics, color: o.color || INK });
const para = (runs, o = {}) => new Paragraph({ children: runs, spacing: { after: o.after ?? 0, before: o.before ?? 0 }, alignment: o.align });

// "Name, Designation, Organisation" with the name in bold and the designation in italics, as last year.
const person = p => {
  const r = [run(p.docName || p.name, { bold: true })];
  if (p.designation) r.push(run(', '), run(p.designation, { italics: true }));
  if (p.organisation) r.push(run(', ' + p.organisation));
  return r;
};

const cell = (children, width, fill, o = {}) => new TableCell({
  children: children.length ? children : [para([run('-')])],
  width: { size: width, type: WidthType.DXA },
  shading: fill ? { type: ShadingType.CLEAR, color: 'auto', fill } : undefined,
  verticalAlign: o.top ? VerticalAlign.TOP : VerticalAlign.CENTER,
  margins: { top: 80, bottom: 80, left: 100, right: 100 },
});

function sessionRow(s, tint) {
  // Chair / Moderator column: label each person only when the session has both kinds.
  const both = s.chairs.length && s.moderators.length;
  const lead = [];
  for (const [label, list] of [['Chair', s.chairs], ['Moderator', s.moderators]]) {
    list.forEach((p, i) => {
      lead.push(para([...(both && i === 0 ? [run(label + ': ')] : []), ...person(p)], { before: lead.length && i === 0 ? 160 : 0 }));
    });
  }
  // Speakers column: paper presenters get a marked line above them for the paper title.
  const spk = [];
  s.speakers.forEach((p, i) => {
    if (p.role === 'Paper Presenter') spk.push(para([run('[Paper title]', { italics: true, color: '9A2D50' })], { before: i ? 160 : 0 }));
    spk.push(para(person(p), { after: 60 }));
  });
  return new TableRow({ cantSplit: false, children: [
    cell([para([run(s.title)])], COLS[0], tint),
    cell([para([run(s.code)], { align: AlignmentType.CENTER })], COLS[1], tint),
    cell(s.organisers.map(o => para([run(o)])), COLS[2], tint),
    cell(lead, COLS[3], tint),
    cell(spk, COLS[4], tint, { top: true }),
  ] });
}

const header = st => new TableRow({ tableHeader: true, children: ['Session name', 'Session code', 'Session organiser', 'Chair/ Moderator', 'Speaker']
  .map((t, i) => cell([para([run(t, { bold: true, color: st.text })], { align: AlignmentType.CENTER })], COLS[i], st.head)) });

/**
 * days: [{ label: 'Day 1 · Tuesday, 17 November', colour: 'purple', sessions: [{ code, title, organisers: [], chairs: [], moderators: [], speakers: [] }] }]
 * stamp: human-readable time the file was made.
 */
export async function writeProgrammeDoc(file, days, stamp) {
  const children = [
    para([run('ILDC 2026 PROGRAMME AGENDA', { bold: true, size: 32 })], { align: AlignmentType.CENTER, after: 80 }),
    para([run(`Generated from Airtable on ${stamp}. Paper titles and unregistered speakers are added by hand.`, { italics: true, size: 16, color: '6B6A85' })],
      { align: AlignmentType.CENTER, after: 240 }),
  ];
  days.forEach((d, di) => {
    const st = DAY_STYLE[d.colour] || DAY_STYLE.purple;
    children.push(new Paragraph({ heading: HeadingLevel.HEADING_1, pageBreakBefore: di > 0, alignment: AlignmentType.CENTER, spacing: { after: 160 },
      shading: { type: ShadingType.CLEAR, color: 'auto', fill: st.head }, children: [run('  ' + d.label + '  ', { bold: true, size: 26, color: st.text })] }));
    const border = { style: BorderStyle.SINGLE, size: 4, color: 'FFFFFF' };
    children.push(new Table({
      width: { size: COLS.reduce((a, b) => a + b), type: WidthType.DXA }, columnWidths: COLS,
      borders: { top: border, bottom: border, left: border, right: border, insideHorizontal: border, insideVertical: border },
      rows: [header(st), ...d.sessions.map((s, i) => sessionRow(s, i % 2 ? CREAM : st.tint))],
    }));
  });
  const doc = new Document({
    creator: 'ILDC poster builder', title: 'ILDC 2026 Programme Agenda',
    sections: [{ properties: { page: { size: { orientation: PageOrientation.PORTRAIT, width: 11906, height: 16838 }, margin: { top: 850, bottom: 850, left: 850, right: 850 } } }, children }],
  });
  fs.writeFileSync(file, await Packer.toBuffer(doc));
}
