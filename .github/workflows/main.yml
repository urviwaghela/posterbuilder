// The "engine": one headless browser that crops photos, trims logos and renders posters.
import { createRequire } from 'node:module';
import { execFileSync } from 'node:child_process';
import fs from 'node:fs';
import os from 'node:os';
import path from 'node:path';
import { removeBackground } from '@imgly/background-removal-node';
import { serve } from './server.mjs';
const { chromium } = createRequire(import.meta.url)('playwright');

const dataUrl = (buf, mime) => `data:${mime};base64,${Buffer.from(buf).toString('base64')}`;
const fromDataUrl = s => Buffer.from(s.split(',')[1], 'base64');

export function mimeOf(filename = '', fallback = '') {
  const ext = path.extname(filename).toLowerCase();
  return { '.jpg': 'image/jpeg', '.jpeg': 'image/jpeg', '.png': 'image/png', '.webp': 'image/webp', '.gif': 'image/gif',
    '.pdf': 'application/pdf', '.svg': 'image/svg+xml', '.heic': 'image/heic', '.heif': 'image/heif' }[ext] || fallback || 'application/octet-stream';
}

// PDFs become a PNG of their first page. Returns { buf, mime } or throws a readable error.
export function toImage(buf, filename, mime) {
  mime = mime || mimeOf(filename);
  if (mime === 'application/pdf') {
    const dir = fs.mkdtempSync(path.join(os.tmpdir(), 'pdf-'));
    fs.writeFileSync(path.join(dir, 'in.pdf'), buf);
    execFileSync('pdftoppm', ['-png', '-r', '200', '-f', '1', '-l', '1', '-singlefile', path.join(dir, 'in.pdf'), path.join(dir, 'out')]);
    return { buf: fs.readFileSync(path.join(dir, 'out.png')), mime: 'image/png', note: 'converted from PDF' };
  }
  if (/heic|heif/.test(mime)) throw new Error('photo is HEIC (iPhone format) – please upload a JPG');
  if (!/^image\/(jpeg|png|webp|gif|svg\+xml)$/.test(mime)) throw new Error(`not an image file (${mime}) – please upload a PNG or JPG`);
  return { buf, mime };
}

export async function startEngine(root) {
  const srv = await serve(root);
  const browser = await chromium.launch();
  const tools = await browser.newPage();
  await tools.goto(srv.url + '/browser.html');
  const poster = await (await browser.newContext({ viewport: { width: 1080, height: 1350 }, deviceScaleFactor: 2 })).newPage();

  return {
    url: srv.url,

    // Raw photo bytes → { png (standard cut-out headshot), flags[] }
    async headshot(buf, filename, mime) {
      const img = toImage(buf, filename, mime);
      const cut = await removeBackground(new Blob([img.buf], { type: img.mime }), { model: 'medium', output: { format: 'image/png' } });
      const cutBuf = Buffer.from(await cut.arrayBuffer());
      const r = await tools.evaluate(([a, b]) => standardise(a, b), [dataUrl(img.buf, img.mime), dataUrl(cutBuf, 'image/png')]);
      if (img.note) r.flags.unshift(img.note);
      return r.ok ? { png: fromDataUrl(r.cutout), flags: r.flags } : { png: null, flags: r.flags };
    },

    async logo(buf, filename, mime) {
      const img = toImage(buf, filename, mime);
      const r = await tools.evaluate(s => trimLogo(s), dataUrl(img.buf, img.mime));
      return { png: fromDataUrl(r.png), aspect: r.aspect };
    },

    // Render one poster. `data` uses URLs relative to the engine's server root. Returns { png, warnings }.
    async render(data) {
      await poster.goto(srv.url + '/poster.html');
      const warnings = await poster.evaluate(d => render(d), data);
      return { png: await poster.screenshot({ type: 'png' }), warnings };
    },

    // Landscape banner (1600×900) for the top of the session page on the website.
    async banner(data) {
      if (!this._banner) this._banner = await (await browser.newContext({ viewport: { width: 1600, height: 900 }, deviceScaleFactor: 1 })).newPage();
      await this._banner.goto(srv.url + '/banner.html');
      await this._banner.evaluate(d => render(d), data);
      return await this._banner.screenshot({ type: 'png' });
    },

    // Phone version of the banner (1080×1300): bigger text, logos across the full width.
    async bannerMobile(data) {
      if (!this._bannerM) this._bannerM = await (await browser.newContext({ viewport: { width: 1080, height: 1300 }, deviceScaleFactor: 1 })).newPage();
      await this._bannerM.goto(srv.url + '/banner_mobile.html');
      await this._bannerM.evaluate(d => render(d), data);
      return await this._bannerM.screenshot({ type: 'png' });
    },

    // Organiser logos on a transparent background (1400×200).
    async logoRow(logos) {
      if (!this._logos) this._logos = await (await browser.newContext({ viewport: { width: 1400, height: 200 }, deviceScaleFactor: 1 })).newPage();
      await this._logos.goto(srv.url + '/logos.html');
      await this._logos.evaluate(d => render(d), { logos });
      return await this._logos.screenshot({ type: 'png', omitBackground: true });
    },

    // Programme PDF: two posters side by side per A4 landscape page.
    async programme(pngPaths, outPath) {
      const pages = [];
      for (let i = 0; i < pngPaths.length; i += 2) pages.push(pngPaths.slice(i, i + 2));
      const p = await browser.newPage();
      await p.setContent(`<!doctype html><base href="${srv.url}/"><style>
        @page { size: A4 landscape; margin: 0 } body { margin: 0 }
        .pg { width: 297mm; height: 210mm; display: flex; justify-content: center; align-items: center; gap: 8mm; page-break-after: always; }
        .pg img { height: 188mm; width: 150.4mm; display: block; }</style>${pages.map(pg => `<div class="pg">${pg.map(f => `<img src="/${f}">`).join('')}</div>`).join('')}`);
      await p.waitForLoadState('networkidle');
      await p.pdf({ path: outPath, format: 'A4', landscape: true, printBackground: true });
      await p.close();
    },

    async close() { await browser.close(); srv.close(); },
  };
}

<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Organiser logos</title>
<style>
  /* A clean, transparent row of a session's organiser logos for the website (1400 × 200). */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1400px; height: 200px; background: transparent; }
  #logos { width: 1400px; height: 200px; display: flex; align-items: center; justify-content: center; gap: 72px; padding: 0 20px; }
  #logos img { display: block; }
</style>
</head>
<body>
<div id="logos"></div>
<script>
async function render(d) {
  // Equal visual weight: every logo gets about the same area, capped in height and width.
  const L = d.logos.length, avail = 1360, gap = 72, maxH = 150, maxW = L <= 2 ? 520 : 380;
  let area = maxH * maxH * 1.7;
  const dims = a => d.logos.map(l => { let h = Math.min(maxH, Math.sqrt(a / l.aspect)), w = h * l.aspect; if (w > maxW) { w = maxW; h = w / l.aspect; } return { w, h }; });
  let ds = dims(area);
  while (ds.reduce((s, x) => s + x.w, 0) + gap * (L - 1) > avail && area > 400) { area *= .92; ds = dims(area); }
  document.getElementById('logos').innerHTML = d.logos.map((l, i) => `<img src="${l.src}" alt="" style="width:${ds[i].w.toFixed(1)}px;height:${ds[i].h.toFixed(1)}px">`).join('');
  await Promise.all([...document.images].map(i => i.complete ? 0 : new Promise(r => { i.onload = i.onerror = r; })));
  return [];
}
</script>
</body>
</html>

