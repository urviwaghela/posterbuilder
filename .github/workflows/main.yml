</div>
<div id="footer" class="abs"><div class="label">Session organised by</div><div id="logos"></div></div>
<script>
function fit(el, box, max, min) {
  let s = max; el.style.fontSize = s + 'px';
  while ((box.scrollHeight > box.clientHeight + 1 || box.scrollWidth > box.clientWidth + 1) && s > min) { s -= 1; el.style.fontSize = s + 'px'; }
}
async function render(d) {
  document.body.dataset.colourway = d.colourway || 'purple';
  for (const id of ['corner', 'strip']) document.getElementById(id).style.backgroundImage = `url(${d.art})`;
  if (d.confLogo) document.getElementById('conf-logo').innerHTML = `<img src="${d.confLogo}">`;
  document.getElementById('kicker').textContent = d.kicker;
  const t = document.querySelector('#title span'); t.textContent = d.title;
  document.getElementById('date').textContent = d.date;
  document.getElementById('time').textContent = d.time;
  document.getElementById('room').textContent = d.room;
  document.getElementById('venue').textContent = d.venue;
  // Organiser logos: equal visual area, capped size. No logos means no white strip.
  const L = (d.logos || []).length, footer = document.getElementById('footer');
  if (!L) footer.style.display = 'none';
  else {
    const esc = x => String(x || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const avail = 1600 - 160 - 48 - 330, gap = 40, maxH = L <= 2 ? 86 : 74, maxW = L <= 2 ? 420 : 260;
    const dims = a => d.logos.map(l => { let h = Math.min(maxH, Math.sqrt(a / l.aspect)), w = h * l.aspect; if (w > maxW) { w = maxW; h = w / l.aspect; } return { w, h }; });
    let a = maxH * maxH * 2.2, ds = dims(a);
    while (ds.reduce((t, x) => t + x.w, 0) + gap * (L - 1) > avail && a > 400) { a *= .92; ds = dims(a); }
    document.getElementById('logos').innerHTML = d.logos.map((l, i) => `<img src="${l.src}" alt="${esc(l.name)}" style="width:${ds[i].w.toFixed(1)}px;height:${ds[i].h.toFixed(1)}px">`).join('');
  }
  await document.fonts.ready;
  await Promise.all([...document.images].map(i => i.complete ? 0 : new Promise(r => { i.onload = i.onerror = r; })));
  await new Promise(r => { const i = new Image(); i.onload = i.onerror = r; i.src = d.art; });
  fit(t, document.getElementById('title'), 68, 40);
  // place the room block after the date block
  const when = document.getElementById('when').getBoundingClientRect();
  const x = Math.max(560, when.right + 48);
  document.getElementById('where-line').style.left = x + 'px';
  document.getElementById('where').style.left = (x + 30) + 'px';
  return [];
}
</script>
