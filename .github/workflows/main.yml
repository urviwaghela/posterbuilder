// ILDC poster builder: Airtable → posters → Airtable + Wix.
//
//   node sync.mjs            normal run (what GitHub runs every hour)
//   node sync.mjs --all      redraw every poster even if nothing changed
//
// Needs four environment variables (GitHub "secrets"):
//   AIRTABLE_TOKEN, AIRTABLE_BASE_ID, WIX_API_KEY, WIX_SITE_ID
//
// What it does, in order:
//   1. Reads the Sessions, Registrations and Organisers tables.
//   2. For every speaker linked to a session: makes the standard cut-out headshot once per photo
//      (re-used afterwards; a new photo in Airtable triggers a new crop) and writes it back to
//      "Poster photo", with any warnings in "Photo check".
//   3. Draws each session's poster when something on it changed, saves it to "Poster",
//      and writes problems to "Poster status" and the time to "Last built".
//   4. Sessions with "Publish" ticked are copied to the Wix CMS collection that the website reads;
//      unticking Publish takes the session off the website.
//   5. Writes output/programme.pdf with all published posters (downloadable from the GitHub run).
import fs from 'node:fs';
import path from 'node:path';
import crypto from 'node:crypto';
import { airtable } from './airtable.mjs';
import { wix } from './wix.mjs';
import { startEngine, mimeOf } from './engine.mjs';
import { writeProgrammeDoc } from './programme_doc.mjs';

// ---------- Names of tables and fields in Airtable (change here if you rename them) ----------
const T = { sessions: 'Sessions', people: 'Registrations', orgs: 'Organisers' };
const F = {
  // Sessions
  code: 'Session code', number: 'Session number', title: 'Title', date: 'Date', start: 'Start time', end: 'End time',
  room: 'Room', venue: 'Venue', about: 'About', themes: ['Themes', 'Theme 1, Theme 2, Theme 3, Theme 4'],
  speakers: 'Panelists', chair: 'Chair', moderator: 'Moderator',   // Chair and Moderator are optional link fields
  organisers: 'Organisers', colour: 'Colour', publish: 'Publish',
  poster: 'Poster', status: 'Poster status', built: 'Last built',
  // Registrations
  name: 'Name', honorific: 'Title', designation: 'Designation', organisation: 'Organization', photo: 'Photo', capacity: 'Attending capacity', bio: 'Bio',
  regCode: 'Unique Code',                       // optional; the Airtable record id is used if missing
  posterPhoto: 'Poster photo', photoCheck: 'Photo check',
  // Organisers
  orgName: 'Name', logo: 'Logo',
};
const WIX_COLLECTION = 'ConferenceSessions', WIX_SPEAKERS = 'ConferenceSpeakers', WIX_REF = 'speakerList';
const DAY_ZERO = '2026-11-16';   // pre-conference day = Day 0, 17 Nov = Day 1 …
// Poster colour follows the day (Day 0 and anything else: purple).
const DAY_COLOUR = { '2026-11-17': 'purple', '2026-11-18': 'mustard', '2026-11-19': 'green' };
const dayLabel = iso => iso ? `Day ${Math.round((Date.parse(iso) - Date.parse(DAY_ZERO)) / 864e5)}` : '';
const MODERATOR = /moderator|chair/i;
// Role tag shown on the poster and the website, from the Registrations "Attending capacity" field.
const roleOf = c => MODERATOR.test(c) ? 'Moderator' : /paper/i.test(c) ? 'Paper Presenter' : /panel/i.test(c) ? 'Panelist' : 'Speaker';
const MAX_SPEAKERS = 10;

const root = path.dirname(new URL(import.meta.url).pathname);
const work = path.join(root, 'work');
const FORCE = process.argv.includes('--all');
const env = k => { const v = process.env[k]; if (!v) { console.error(`Missing setting ${k}. Add it under GitHub → Settings → Secrets and variables → Actions.`); process.exit(1); } return v.trim(); };

const AT = airtable({ token: env('AIRTABLE_TOKEN'), baseId: env('AIRTABLE_BASE_ID'), apiBase: process.env.AIRTABLE_API_BASE });
const WX = wix({ apiKey: env('WIX_API_KEY'), siteId: env('WIX_SITE_ID'), apiBase: process.env.WIX_API_BASE });

const log = (...a) => console.log(...a);
const sha = s => crypto.createHash('sha1').update(s).digest('hex');
const att = v => (Array.isArray(v) && v.length ? v[0] : null);            // first attachment
const str = v => (v == null ? '' : Array.isArray(v) ? v.join(', ') : typeof v === 'object' ? (v.name ?? '') : String(v)).trim();
async function download(url) { const r = await fetch(url); if (!r.ok) throw new Error(`download failed (${r.status})`); return Buffer.from(await r.arrayBuffer()); }
const write = (rel, buf) => { const p = path.join(work, rel); fs.mkdirSync(path.dirname(p), { recursive: true }); fs.writeFileSync(p, buf); return '/work/' + rel; };

// Names: tidy spaces, drop titles typed into the name ("Dr. X" → "X"); titles are not shown on posters.
// Titles shown before a name: Dr and Prof only (from the Registrations "Title" field, or written into the name itself).
const SHOW_TITLES = { dr: 'Dr', prof: 'Prof', professor: 'Prof' };
const honorific = fields => { const raw = str(fields['Title']) || (str(fields['Name']).match(/^\s*(dr|prof|professor)\b/i) || [])[1] || '';
  return SHOW_TITLES[raw.replace(/\./g, '').trim().toLowerCase()] || ''; };
// Names always in title case ("ANITA RAO" / "anita rao" → "Anita Rao"); short initials without vowels stay as they are ("BK").
const titleCaseWord = w => /^[B-DF-HJ-NP-TV-Z]{2,3}$/.test(w) ? w : w.toLowerCase().replace(/(^|[-'’.])(\p{L})/gu, (m, a, b) => a + b.toUpperCase());
const cleanName = n => str(n).replace(/\s+/g, ' ').replace(/^(dr|prof|mr|mrs|ms|smt|shri)(\.\s*|\s+)/i, '').trim().split(' ').map(titleCaseWord).join(' ');
// Every title for the programme agenda (Mr, Ms, Dr, Prof …), from the Registrations "Title" field.
const ALL_TITLES = { dr: 'Dr', prof: 'Prof', professor: 'Prof', mr: 'Mr', ms: 'Ms', mrs: 'Mrs', smt: 'Smt', shri: 'Shri', miss: 'Miss' };
const anyTitle = fields => { const raw = (str(fields['Title']) || (str(fields['Name']).match(/^\s*(dr|prof|professor|mr|mrs|ms|smt|shri|miss)\b/i) || [])[1] || '').replace(/\./g, '').trim();
  return ALL_TITLES[raw.toLowerCase()] || (/^no\b|^none$|^-$/i.test(raw) ? '' : raw); };
function fmtTime(t) {
  t = str(t); if (!t) return '';
  const m = t.match(/^(\d{1,2})[:.](\d{2})\s*(am|pm)?$/i); if (!m) return t;
  let h = +m[1]; const ap = m[3] ? m[3].toUpperCase() : (h >= 12 ? 'PM' : 'AM');
  if (!m[3]) h = h % 12 || 12;
  return `${h}:${m[2]} ${ap}`;
}
const fmtDate = iso => iso ? new Date(iso + 'T00:00:00Z').toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric', timeZone: 'UTC' }) : '';
const sortTime = t => { const m = str(t).match(/^(\d{1,2})[:.](\d{2})\s*(am|pm)?$/i); if (!m) return '99:99'; let h = +m[1]; if (m[3]?.toLowerCase() === 'pm' && h < 12) h += 12; if (m[3]?.toLowerCase() === 'am' && h === 12) h = 0; return String(h).padStart(2, '0') + ':' + m[2]; };

async function main() {
  const t0 = Date.now();
  fs.rmSync(work, { recursive: true, force: true });
  fs.mkdirSync(path.join(root, 'output'), { recursive: true });

  // ---- 0. Check the base has the fields we expect, with a readable message if not ----
  const schema = await AT.schema();
  const problems = [];
  const need = {
    [T.sessions]: [F.code, F.title, F.date, F.start, F.end, F.room, F.venue, F.about, F.speakers, F.organisers, F.publish, F.poster, F.status, F.built],
    [T.people]: [F.name, F.designation, F.organisation, F.photo, F.capacity, F.bio, F.posterPhoto, F.photoCheck],
    [T.orgs]: [F.orgName, F.logo],
  };
  for (const [table, fields] of Object.entries(need)) {
    if (!schema[table]) { problems.push(`Table "${table}" not found. Tables in the base: ${Object.keys(schema).join(', ')}`); continue; }
    for (const f of fields) if (!schema[table].fields[f]) problems.push(`Field "${f}" not found in table "${table}".`);
  }
  const themeField = F.themes.find(f => schema[T.sessions]?.fields[f]);
  if (problems.length) { console.error('Setup problems:\n - ' + problems.join('\n - ')); process.exit(1); }
  const builtIsDate = /date/i.test(schema[T.sessions].fields[F.built].type);

  // ---- 1. Read the tables ----
  const [sessions, people, orgs] = await Promise.all([AT.list(T.sessions), AT.list(T.people), AT.list(T.orgs)]);
  const personById = new Map(people.map(r => [r.id, r]));
  const orgById = new Map(orgs.map(r => [r.id, r]));
  const live = sessions.filter(s => str(s.fields[F.code]) || str(s.fields[F.title]));
  log(`Read ${live.length} sessions, ${people.length} registrations, ${orgs.length} organisers.`);

  const engine = await startEngine(root);
  const report = [];
  try {
    // ---- 2. Headshots for everyone linked to a session ----
    const linked = new Set(live.flatMap(s => s.fields[F.speakers] || []));
    const photoOf = new Map();       // person record id → { path, key, flags }
    const personUpdates = [];
    for (const pid of linked) {
      const p = personById.get(pid); if (!p) continue;
      const src = att(p.fields[F.photo]);
      if (!src) { photoOf.set(pid, { path: null, key: 'none', flags: ['no photo uploaded'] }); continue; }
      const cachedName = `headshot_${src.id}.png`;            // the source attachment's id: a new photo gives a new id
      const cached = (p.fields[F.posterPhoto] || []).find(a => a.filename === cachedName);
      try {
        if (cached && !FORCE) {
          const prev = str(p.fields[F.photoCheck]);
          const flags = prev && prev !== 'OK' ? prev.split('; ').filter(Boolean) : [];
          photoOf.set(pid, { path: write(`photos/${pid}.png`, await download(cached.url)), key: src.id, flags });
          continue;
        }
        log(`  photo: ${str(p.fields[F.name])}`);
        const r = await engine.headshot(await download(src.url), src.filename, src.type || mimeOf(src.filename));
        if (Array.isArray(p.fields[F.photo]) && p.fields[F.photo].length > 1) r.flags.push(`${p.fields[F.photo].length} photos uploaded – the first one is used`);
        if (!r.png) { photoOf.set(pid, { path: null, key: src.id, flags: r.flags }); personUpdates.push({ id: pid, fields: { [F.photoCheck]: r.flags.join('; ') } }); continue; }
        const up = await WX.upload(r.png, cachedName, 'image/png');
        photoOf.set(pid, { path: write(`photos/${pid}.png`, r.png), key: src.id, flags: r.flags, wix: up });
        personUpdates.push({ id: pid, fields: { [F.posterPhoto]: [{ url: up.url, filename: cachedName }], [F.photoCheck]: r.flags.length ? r.flags.join('; ') : 'OK' } });
      } catch (e) {
        const msg = String(e.message || e).slice(0, 200);
        photoOf.set(pid, { path: null, key: src.id, flags: [msg] });
        personUpdates.push({ id: pid, fields: { [F.photoCheck]: msg } });
      }
    }
    if (personUpdates.length) await AT.update(T.people, personUpdates);

    // ---- Logos ----
    const logoOf = new Map();
    for (const oid of new Set(live.flatMap(s => s.fields[F.organisers] || []))) {
      const o = orgById.get(oid); const src = o && att(o.fields[F.logo]);
      if (!src) continue;
      try {
        const r = await engine.logo(await download(src.url), src.filename, src.type || mimeOf(src.filename));
        logoOf.set(oid, { path: write(`logos/${oid}.png`, r.png), aspect: r.aspect, key: src.id });
      } catch (e) { log(`  logo problem (${str(o.fields[F.orgName])}): ${e.message}`); }
    }

    // ---- 3. Posters ----
    const template = sha(['poster.html', 'banner.html', 'banner_mobile.html', 'logos.html'].map(f => fs.readFileSync(path.join(root, f), 'utf8')).join() + fs.readdirSync(root).filter(f => f.endsWith('.png')).join());
    const wixItems = new Map((await WX.queryAll(WIX_COLLECTION)).map(i => [str(i.data.sessionCode), i]));
    const sessionUpdates = [], published = [], docRows = [];
    const leadRole = new Map();   // person id → 'Chair' / 'Moderator' from the sessions' own fields
    const now = new Date();

    for (const s of live) {
      const f = s.fields, code = str(f[F.code]) || s.id;
      const status = [];
      if (!str(f[F.title])) status.push('Title is empty');
      if (!f[F.date]) status.push('Date is empty');
      if (!str(f[F.start]) || !str(f[F.end])) status.push('Start or end time is empty');
      if (!str(f[F.room])) status.push('Room is empty');
      // Codes are day · slot · room (111 = Day 1, slot 1, room 1): the first digit must match the date.
      if (/^\d{3}$/.test(code) && f[F.date]) {
        const dateDay = Math.round((Date.parse(f[F.date]) - Date.parse(DAY_ZERO)) / 864e5);
        if (+code[0] !== dateDay) status.push(`Code ${code} says Day ${code[0]} but the date (${fmtDate(f[F.date])}) is Day ${dateDay}`);
      }

      const mk = (pid, role) => {
        const p = personById.get(pid); if (!p) return null;
        const ph = photoOf.get(pid) || { path: null, key: 'none', flags: [] };
        const name = [honorific(p.fields), cleanName(p.fields[F.name])].filter(Boolean).join(' ');
        ph.flags.forEach(x => status.push(`${name}: ${x}`));
        if (!str(p.fields[F.organisation])) status.push(`${name}: no organisation`);
        return { id: pid, name, docName: [anyTitle(p.fields), cleanName(p.fields[F.name])].filter(Boolean).join(' '),
          designation: str(p.fields[F.designation]), organisation: str(p.fields[F.organisation]),
          role: role || roleOf(str(p.fields[F.capacity])), photo: ph.path, photoKey: ph.key };
      };
      // Chair and Moderator come from the session's own link fields when either is filled;
      // otherwise moderators are found from "Attending capacity" as before.
      const chairIds = f[F.chair] || [], modIds = (f[F.moderator] || []).filter(id => !chairIds.includes(id));
      let speakers;
      if (chairIds.length || modIds.length) {
        const lead = new Set([...chairIds, ...modIds]);
        chairIds.forEach(id => leadRole.set(id, 'Chair')); modIds.forEach(id => { if (!leadRole.has(id)) leadRole.set(id, 'Moderator'); });
        speakers = [...chairIds.map(id => mk(id, 'Chair')), ...modIds.map(id => mk(id, 'Moderator')),
          ...(f[F.speakers] || []).filter(id => !lead.has(id)).map(id => { const x = mk(id); if (x && x.role === 'Moderator') x.role = 'Panelist'; return x; })].filter(Boolean);
      } else {
        speakers = (f[F.speakers] || []).map(id => mk(id)).filter(Boolean);
        speakers = [...speakers.filter(x => x.role === 'Moderator'), ...speakers.filter(x => x.role !== 'Moderator')];   // moderators first
      }
      if (str(f[F.code]) && f[F.date]) docRows.push({ code, date: f[F.date], title: str(f[F.title]),
        organisers: (f[F.organisers] || []).map(oid => str(orgById.get(oid)?.fields[F.orgName])).filter(Boolean),
        chairs: speakers.filter(x => x.role === 'Chair'), moderators: speakers.filter(x => x.role === 'Moderator'),
        speakers: speakers.filter(x => x.role !== 'Chair' && x.role !== 'Moderator') });
      if (!speakers.length) status.push('No speakers linked yet');
      if (speakers.length > MAX_SPEAKERS) status.push(`${speakers.length} speakers – a poster holds at most ${MAX_SPEAKERS}`);

      const logos = (f[F.organisers] || []).map(oid => {
        const o = orgById.get(oid), l = logoOf.get(oid);
        if (!l) { status.push(`${str(o?.fields[F.orgName]) || 'An organiser'}: no logo`); return null; }
        return { name: str(o.fields[F.orgName]), src: l.path, aspect: l.aspect, key: l.key };
      }).filter(Boolean);

      const colour = DAY_COLOUR[f[F.date]] || 'purple';
      const themes = themeField ? str(f[themeField]).split(/\r?\n/).map(x => x.replace(/^[\s•\-–\d.)]+/, '').trim()).filter(Boolean).slice(0, 4) : [];
      const data = {
        sessionNo: str(f[F.number]) || (code.match(/\d+/)?.[0] ?? ''), title: str(f[F.title]), colour, colourway: colour,
        date: fmtDate(f[F.date]), time: [fmtTime(f[F.start]), fmtTime(f[F.end])].filter(Boolean).join(' – '),
        room: str(f[F.room]), venue: str(f[F.venue]), about: str(f[F.about]), themes,
        speakers: speakers.map(({ id, photoKey, ...x }) => x), logos: logos.map(({ key, ...x }) => x), showDesignation: true,
        art: fs.existsSync(path.join(root, `art_${colour}.png`)) ? `/art_${colour}.png` : '/art_purple.png',
        confLogo: '/ildc_emblem.png', wordmark: '/ildc_wordmark_white.png',
      };
      // Fingerprint of everything that appears on the poster; unchanged fingerprint = nothing to redraw.
      const key = sha(JSON.stringify({ template, data: { ...data, speakers: speakers.map(x => [x.name, x.designation, x.organisation, x.role, x.photoKey]), logos: logos.map(l => l.key) } })).slice(0, 10);
      const posterName = `${code}_${key}.png`;
      const current = (f[F.poster] || []).find(a => a.filename === posterName);
      const canDraw = speakers.length > 0 && speakers.length <= MAX_SPEAKERS;

      let posterPath = null, wixPoster = null, warnings = [];
      if (canDraw && (!current || FORCE)) {
        data.stamp = `${code} · updated ${now.toLocaleString('en-GB', { timeZone: 'Asia/Kolkata', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })}`;
        const r = await engine.render(data);
        warnings = r.warnings.filter(w => !/no approved photo/.test(w));
        posterPath = write(`posters/${code}.png`, r.png);
        wixPoster = await WX.upload(r.png, posterName, 'image/png');
        log(`  drew ${code}`);
      } else if (canDraw && current) {
        posterPath = write(`posters/${code}.png`, await download(current.url));
      }
      const statusText = [...new Set([...status, ...warnings])].map(x => '• ' + x).join('\n') || 'OK';

      const upd = {};
      if (wixPoster) {
        upd[F.poster] = [{ url: wixPoster.url, filename: posterName }];
        upd[F.built] = builtIsDate ? now.toISOString() : now.toLocaleString('en-GB', { timeZone: 'Asia/Kolkata', dateStyle: 'medium', timeStyle: 'short' }) + ' IST';
      }
      if (str(f[F.status]) !== statusText) upd[F.status] = statusText;
      if (Object.keys(upd).length) sessionUpdates.push({ id: s.id, fields: upd });
      report.push(`${code}  ${str(f[F.title])}\n${statusText.split('\n').map(x => '    ' + x).join('\n')}`);

      if (f[F.publish] && canDraw) {
        const sort = `${f[F.date] || '9999'} ${sortTime(f[F.start])} ${code}`;
        const bannerData = { colourway: colour, art: data.art, confLogo: data.confLogo, kicker: [`Session ${data.sessionNo || code}`, dayLabel(f[F.date])].filter(Boolean).join(' · '),
          title: data.title, date: data.date, time: data.time, room: data.room, venue: data.venue, logos: data.logos };
        published.push({ code, sort, path: posterPath, posterName, wixPoster, posterKey: key, speakerIds: speakers.map(x => x.id), bannerData, logoList: data.logos,
          wd: {
            title: str(f[F.title]), sessionCode: code, date: f[F.date] || null,
            day: dayLabel(f[F.date]),
            dateLabel: f[F.date] ? new Date(f[F.date] + 'T00:00:00Z').toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric', timeZone: 'UTC' }) : '',
            speakerCount: `${speakers.length} speaker${speakers.length === 1 ? '' : 's'}`,
            themesText: themes.join('\n'),
            startTime: str(f[F.start]), endTime: str(f[F.end]), timeLabel: data.time, sortKey: sort,
            room: data.room, venue: data.venue, about: data.about, themes,
            speakers: speakers.map(x => [`${x.name} (${x.role})`, x.designation, x.organisation].filter(Boolean).join(', ')).join('\n'),
            organisers: logos.map(l => l.name).join(', '), colour,
          } });
      }
    }
    if (sessionUpdates.length) await AT.update(T.sessions, sessionUpdates);

    // ---- 4. Website: speakers first (sessions link to them), then sessions ----
    const wixSpeakers = new Map((await WX.queryAll(WIX_SPEAKERS)).map(i => [str(i.data.regCode), i]));
    const speakerItemId = new Map();          // person record id → Wix item id
    // Fixed website images (day background, landscape strip, moderator tag): uploaded once per run, only if something is written.
    const assetCache = {};
    const webAsset = name => assetCache[name] ??= WX.upload(fs.readFileSync(path.join(root, name)), name, name.endsWith('.jpg') ? 'image/jpeg' : 'image/png');
    const WEB_VERSION = 'web2';   // bump when the fixed images change, so every item is rewritten

    const wanted = new Set(published.flatMap(p => p.speakerIds));
    for (const pid of wanted) {
      const p = personById.get(pid), ph = photoOf.get(pid) || {};
      const regCode = str(p.fields[F.regCode]) || pid;
      const sd = { title: [honorific(p.fields), cleanName(p.fields[F.name])].filter(Boolean).join(' '), designation: str(p.fields[F.designation]), organisation: str(p.fields[F.organisation]),
        bio: str(p.fields[F.bio]), role: leadRole.get(pid) || roleOf(str(p.fields[F.capacity])), regCode };
      sd.affiliation = [sd.designation, sd.organisation].filter(Boolean).join(', ');
      const k = sha(JSON.stringify(sd) + (ph.key || '') + WEB_VERSION).slice(0, 10);
      let item = wixSpeakers.get(regCode);
      if (!item || item.data.buildKey !== k) {
        let photo = ph.wix;
        if (!photo && ph.path) photo = await WX.upload(fs.readFileSync(path.join(root, ph.path)), `headshot_${ph.key}.png`, 'image/png');
        const tag = await webAsset(sd.role === 'Moderator' ? 'tag_moderator.png' : sd.role === 'Chair' ? 'tag_chair.png' : 'tag_none.png');
        const full = { ...sd, photo: photo ? photo.uri : null, roleTag: tag.uri, buildKey: k };
        const r = item ? await WX.replace(WIX_SPEAKERS, item.id, full) : await WX.insert(WIX_SPEAKERS, full);
        item = r.dataItem || item;
        log(`  website: ${wixSpeakers.has(regCode) ? 'updated' : 'added'} speaker ${sd.title}`);
      }
      speakerItemId.set(pid, item.id);
    }
    const keepCodes = new Set([...wanted].map(pid => str(personById.get(pid).fields[F.regCode]) || pid));
    for (const [code, item] of wixSpeakers) if (!keepCodes.has(code)) { await WX.remove(WIX_SPEAKERS, item.id); log(`  website: removed speaker ${item.data.title}`); }

    const publishedCodes = new Set(published.map(p => p.code));
    for (const p of published) {
      const ids = p.speakerIds.map(id => speakerItemId.get(id));
      const k = sha(p.posterKey + ids.join() + JSON.stringify(p.wd) + WEB_VERSION).slice(0, 10);
      const item = wixItems.get(p.code);
      if (item && item.data.buildKey === k) continue;
      let poster = p.wixPoster;
      if (!poster) poster = await WX.upload(fs.readFileSync(path.join(root, p.path)), p.posterName, 'image/png');
      // Landscape banner and organiser-logo row for the session page.
      const banner = await WX.upload(await engine.banner(p.bannerData), `${p.code}_${k}_banner.png`, 'image/png');
      const bannerM = await WX.upload(await engine.bannerMobile(p.bannerData), `${p.code}_${k}_banner_mobile.png`, 'image/png');
      const logoRow = p.logoList.length ? await WX.upload(await engine.logoRow(p.logoList), `${p.code}_${k}_logos.png`, 'image/png') : null;
      const full = { ...p.wd, poster: poster.uri, posterUrl: poster.url, banner: banner.uri, bannerMobile: bannerM.uri, organiserLogos: logoRow ? logoRow.uri : null,
        dayBackground: (await webAsset(`bg_${p.wd.colour}.png`)).uri, dayStrip: (await webAsset(`strip_${p.wd.colour}.jpg`)).uri,
        buildKey: k, lastUpdated: { $date: new Date().toISOString() } };
      const r = item ? await WX.replace(WIX_COLLECTION, item.id, full) : await WX.insert(WIX_COLLECTION, full);
      await WX.replaceRefs(WIX_COLLECTION, item ? item.id : r.dataItem.id, WIX_REF, ids);
      log(`  website: ${item ? 'updated' : 'added'} session ${p.code}`);
    }
    for (const [code, item] of wixItems) if (!publishedCodes.has(code)) { await WX.remove(WIX_COLLECTION, item.id); log(`  website: removed session ${code} (Publish unticked)`); }

    // ---- 5. Programme PDF (published sessions, in date/time order) ----
    published.sort((a, b) => a.sort.localeCompare(b.sort));
    if (published.length) await engine.programme(published.map(p => p.path.replace(/^\//, '')), path.join(root, 'output/programme.pdf'));

    // ---- 6. Programme agenda (Word), every session with a code and a date, timestamped ----
    const ist = new Date(Date.now() + 5.5 * 3600e3).toISOString();   // IST clock time
    const stamp = new Date().toLocaleString('en-GB', { timeZone: 'Asia/Kolkata', day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' }) + ' IST';
    const byDate = new Map();
    for (const r of docRows) { if (!byDate.has(r.date)) byDate.set(r.date, []); byDate.get(r.date).push(r); }
    const days = [...byDate.keys()].sort().map(date => ({
      label: `${dayLabel(date)} · ${new Date(date + 'T00:00:00Z').toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'UTC' })}`,
      colour: DAY_COLOUR[date] || 'purple',
      sessions: byDate.get(date).sort((a, b) => a.code.localeCompare(b.code, 'en', { numeric: true })) }));
    if (days.length) {
      const docName = `ILDC2026_Programme_Agenda_${ist.slice(0, 10)}_${ist.slice(11, 16).replace(':', '')}IST.docx`;
      await writeProgrammeDoc(path.join(root, 'output', docName), days, stamp);
      log(`  programme agenda: ${docName}`);
    }
  } finally {
    await engine.close();
  }
  const txt = report.join('\n');
  fs.writeFileSync(path.join(root, 'output/report.txt'), txt + '\n');
  log('\n' + txt + `\n\nDone in ${Math.round((Date.now() - t0) / 1000)}s.`);
}

main().catch(e => { console.error('\nBUILD FAILED: ' + (e.stack || e)); process.exit(1); });

